[package]
name = "streamify_core_rs"
version = "1.0.0"
edition = "2021"
authors = ["Streamify Team"]
description = "High-performance Rust engine for Streamify APK"

[lib]
name = "streamify_core_rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.21"
ureq = { version = "2.10", features = ["json", "tls"] }
sha2 = "0.10"
hmac = "0.12"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
