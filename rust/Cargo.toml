[package]
name = "streamify_core_rs"
version = "1.0.0"
edition = "2021"
authors = ["Streamify Team"]
description = "High-performance Rust engine for Streamify APK"

[lib]
name = "streamify_core_rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.21"
ureq = { version = "2.10", features = ["json", "tls"] }
sha1 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
jni = { version = "0.21", default-features = false }
sha2 = "0.10"
hmac = "0.12"
regex = "1.10"
urlencoding = "2.1"
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
strsim = "0.11"


[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
