name: Gemini Contributor

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  gemini-reply:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini') && !endsWith(github.event.comment.user.login, '[bot]')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
