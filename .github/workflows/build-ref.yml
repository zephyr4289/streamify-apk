name: Build APK from Ref

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / SHA to build (e.g. legacy-6ffa6c4)'
        required: true
        default: 'legacy-6ffa6c4'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android Rust Targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install cargo-ndk
        run: which cargo-ndk || cargo install cargo-ndk --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Configure NDK Environment
        run: |
          NDK_DIR="${ANDROID_HOME}/ndk/26.1.10909125"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamify-apk-${{ inputs.ref }}
          path: app/build/outputs/apk/**/*.apk
