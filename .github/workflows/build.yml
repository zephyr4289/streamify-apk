name: Build Debug APK
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup CCache for C++ Native Build
        uses: hendrikmuhs/ccache-action@v1.2.11
        with:
          key: ${{ runner.os }}-ccache

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install NDK & CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          if ! ./gradlew assembleDebug --build-cache --parallel --stacktrace > build.log 2>&1; then
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Post build log to commit & push to build-logs
        if: env.BUILD_FAILED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERROR_LOG=$(grep -A 2 -B 2 "e: " build.log | tail -n 50 || echo "Could not extract errors. See artifacts.")
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="```text
          $ERROR_LOG
          ```" || true
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin build-logs || true
          git checkout build-logs || git checkout -b build-logs
          cp build.log build-${{ github.run_number }}.log
          git add build-${{ github.run_number }}.log
          git commit -m "docs: add build log for run ${{ github.run_number }}" || true
          git push origin build-logs || true
          exit 1

      - name: Locate and Move APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" streamify.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-Debug-APK
          path: streamify.apk

      - name: Create Build Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Streamify Build ${{ github.run_number }}
          prerelease: true
          files: streamify.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Streamify v1.0.0 (Latest Build)
          body: "Latest automated build containing all AI vector recommendation engines, Python download pipelines, and Spotify UI."
          prerelease: false
          files: streamify.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

