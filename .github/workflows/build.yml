name: Build Debug APK
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install NDK & CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || (tail -n 100 build.log && exit 1)

      - name: Prepare APK for Release
        run: |
          find app/build/outputs/apk -name "*.apk" -exec cp {} ./streamify-app.apk \;
          ls -la streamify-app.apk > prepare.log 2>&1 || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-Debug-APK
          path: streamify-app.apk

      - name: Create Build Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Streamify Build ${{ github.run_number }}
          prerelease: true
          files: streamify-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Streamify v1.0.0 (Latest Build)
          body: "Latest automated build containing all AI vector recommendation engines, Python download pipelines, and Spotify UI."
          prerelease: false
          files: streamify-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Logs to build-logs branch
        if: always()
        run: |
          git clone --branch build-logs https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git logs-repo || true
          cp build.log logs-repo/build-${{ github.run_id }}.log || true
          cp prepare.log logs-repo/prepare-${{ github.run_id }}.log || true
          cd logs-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: add build log for run ${{ github.run_id }}" || true
          git push origin build-logs || true

