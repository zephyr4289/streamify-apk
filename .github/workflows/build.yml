name: Build Debug APK
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install NDK & CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace > build.log 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Commit build log
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin build-logs || git branch build-logs
          git checkout build-logs || git checkout -b build-logs
          cp build.log build-${{ github.run_number }}.log
          git add build-${{ github.run_number }}.log
          git commit -m "docs: add build log for run ${{ github.run_number }}"
          git push origin build-logs

      - name: Fail if build failed
        run: |
          if [ "$BUILD_FAILED" = "true" ]; then
            exit 1
          fi

      - name: Locate and Move APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" streamify.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-Debug-APK
          path: streamify.apk

      - name: Create Build Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Streamify Build ${{ github.run_number }}
          prerelease: true
          files: streamify.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Streamify v1.0.0 (Latest Build)
          body: "Latest automated build containing all AI vector recommendation engines, Python download pipelines, and Spotify UI."
          prerelease: false
          files: streamify.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

