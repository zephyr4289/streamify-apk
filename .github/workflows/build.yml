name: Build Debug APK
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}
      - name: Build Debug APK
        id: gradle_build
        run: ./gradlew assembleDebug 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Upload Logs to build-logs branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin build-logs
          git checkout build-logs
          cp /tmp/build.log build-${{ github.run_id }}.log
          git add build-${{ github.run_id }}.log
          git commit -m "docs: add build log for run ${{ github.run_id }}"
          git push origin build-logs

      - name: Check Build Status
        if: steps.gradle_build.outcome != 'success'
        run: exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: Streamify-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Streamify Build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
