name: Resolver Client Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *" # daily; registry rot is detected before users feel it

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe bare-client × content matrix
        run: bash tools/probe-clients.sh dQw4w9WgXcQ 4NRXx6U8ABQ

      - name: Assert licensed-content survivors exist
        run: |
          OUT=$(bash tools/probe-clients.sh 4NRXx6U8ABQ)
          echo "$OUT"
          # At least one client must return OK with both itag 251 and 140 present.
          if ! echo "$OUT" | awk '$3=="OK" && $4 ~ /^[1-9]/' | grep -q .; then
            echo "::error::No bare client resolves licensed content anymore — resolver registry needs rotation."
            exit 1
          fi

      - name: 🔄 Self-heal — write winning fleet into fleet-config.json
        run: |
          bash tools/probe-clients.sh dQw4w9WgXcQ 4NRXx6U8ABQ | tee /tmp/probe.txt
          python3 tools/write_fleet_config.py /tmp/probe.txt fleet-config.json
          cat fleet-config.json

      - name: Commit rotated fleet config (drives live apps without a release)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain fleet-config.json)" ]]; then
            git add fleet-config.json
            git commit -m "ci(fleet): rotate client fleet from canary probe [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME:-main}
          else
            echo "fleet-config.json unchanged — fleet healthy"
          fi
